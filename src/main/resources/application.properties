spring.application.name=NotificationService

# --- Database ---
spring.datasource.url=jdbc:postgresql://localhost:5432/notification_service
spring.datasource.username=abhkum12
spring.datasource.password=

# --- JPA / Hibernate ---
# ddl-auto=update is fine while we're actively shaping the schema during development.
# We'll switch to Flyway/Liquibase migrations (or validate) before this is "done", so the
# schema history is explicit rather than implicit -- flagged in CLAUDE.md assumptions log.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
